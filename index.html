<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafaf8"><meta name="description" content="하루와 생각을 기록합니다."><title>일기장</title><link rel="stylesheet" href="style.css?v=5"><script src="app.js?v=5" defer></script></head>
<body>
<aside class="sidebar">
<a class="brand" href="#">일기장</a>
<div class="calendar-heading"><h2 id="month-label"></h2><div><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div></div>
<div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar" aria-label="날짜별 기록"></div>
<label class="search"><span class="sr-only">일기 검색</span><input id="search" type="search" placeholder="제목, 내용 검색" aria-label="일기 검색"></label>
<a class="all-entries" href="#" id="all-entries">전체 글</a>
</aside>
<main>
<section id="list-view"><div class="list-heading"><h1 id="list-title">전체 글</h1><span id="count"></span></div><div class="list-columns" aria-hidden="true"><span>제목</span><span>날짜</span></div><div id="entries" aria-live="polite"><p class="muted">글을 불러오는 중입니다.</p></div></section>
<section id="detail-view" hidden><a href="#" class="back-link">← 목록</a><article id="entry"><time id="date"></time><h1 id="title"></h1><div id="body"></div></article><nav class="entry-nav" aria-label="글 탐색"><a id="older" hidden>← 이전 글</a><a id="source" hidden>원문 ↗</a><a id="newer" hidden>다음 글 →</a></nav></section>
</main>
</body></html>
