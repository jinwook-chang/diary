<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><meta name="description" content="하루의 작은 순간을 모으는 나만의 다이어리"><title>사이 · 하루를 담는 작은 공간</title><link rel="stylesheet" href="style.css?v=2"><script src="app.js?v=2" defer></script></head>
<body>
<dialog id="archive-dialog" class="sidebar">
<div class="archive-top"><h2>기록</h2><button id="close-archive" aria-label="기록 닫기">닫기</button></div>
<button class="today-button" id="today">오늘</button>
<div class="calendar-heading"><h2 id="month-label"></h2><div><button id="prev" aria-label="이전 달">‹</button><button id="next" aria-label="다음 달">›</button></div></div>
<div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar" aria-label="날짜 선택"></div>
<div class="archive-heading"><h2>모아둔 하루</h2><span id="entry-count">0</span></div>
<label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="기록 속 문장 찾기" aria-label="일기 검색"></label>
<div id="entries" class="entries"></div>
<div class="sidebar-bottom"><div class="backup-actions"><button id="export">백업 내보내기 ↗</button><button id="import">불러오기</button><input type="file" id="import-file" accept="application/json,.json" hidden></div><p>기록은 이 브라우저에만 저장돼요.<br>소중한 이야기는 가끔 백업해 주세요.</p></div>
</dialog>
<main>
<header class="topbar"><a class="brand" href="./">사이.</a><button id="open-archive">기록</button></header>
<article class="paper">
<div class="paper-top"><h1 id="date-heading"></h1></div>
<label class="sr-only" for="title">일기 제목</label><input id="title" class="entry-title" maxlength="160" placeholder="제목" autocomplete="off">
<label class="sr-only" for="body">일기 내용</label><textarea id="body" placeholder="오늘의 기록"></textarea>
<div class="paper-footer"><span class="save-state" id="save-state" role="status"></span><details class="entry-options"><summary>더보기</summary><div class="options-content"><div id="moods" class="moods" role="group" aria-label="오늘의 기분"></div><div class="options-bottom"><span id="word-count"></span><button id="delete" class="delete-button">기록 삭제</button></div></div></details></div>
</article>
</main><div id="toast" role="status" class="toast" hidden></div>
<dialog id="confirm-dialog"><h2>이 기록을 삭제할까요?</h2><p>삭제한 기록은 되돌릴 수 없어요.</p><form method="dialog"><button value="cancel">취소</button><button value="delete" class="danger">삭제하기</button></form></dialog>
</body></html>
